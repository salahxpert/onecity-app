{% extends "base.html" %}

{% block title %}Salary Records{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold"><i class="bi bi-cash-stack"></i> Salary Records</h2>
            <p class="text-muted">View and sort salary records by month or date.</p>
        </div>
    </div>

    <!-- Sort Buttons -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="btn-group" role="group" aria-label="Sort options">
                <button class="btn btn-outline-primary sort-btn" data-order="asc">
                    <i class="bi bi-sort-up"></i> Ascending
                </button>
                <button class="btn btn-outline-primary sort-btn" data-order="desc">
                    <i class="bi bi-sort-down"></i> Descending
                </button>
            </div>
        </div>
    </div>

    <!-- Table Wrapper -->
    <div class="row">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div id="salaryTableWrapper" class="table-responsive">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const wrapper = document.getElementById('salaryTableWrapper');
        let allData = [];
        let columns = [];
        let currentOrder = 'asc'; // default sort order

        // Helper: Render table
        function renderTable(data) {
            if (!data || data.length === 0) {
                wrapper.innerHTML = `
                    <div class="alert alert-info text-center" role="alert">
                        <i class="bi bi-info-circle"></i> No salary records found.
                    </div>
                `;
                return;
            }

            // Determine columns dynamically from first row
            columns = Object.keys(data[0]);
            let html = `<table class="table table-striped table-hover align-middle">
                <thead class="table-light">
                    <tr>`;
            columns.forEach(col => {
                const displayName = col.charAt(0).toUpperCase() + col.slice(1).replace(/_/g, ' ');
                html += `<th>${displayName}</th>`;
            });
            html += `</tr></thead><tbody>`;

            data.forEach(row => {
                html += `<tr>`;
                columns.forEach(col => {
                    let value = row[col] !== undefined && row[col] !== null ? row[col] : '-';
                    html += `<td>${value}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            wrapper.innerHTML = html;
        }

        // Sorting function
        function sortData(order) {
            if (!allData.length) return;
            currentOrder = order;

            // Find a suitable column for sorting (prefer 'month' or 'date')
            let sortKey = columns.find(c => c.toLowerCase() === 'month' || c.toLowerCase() === 'date' || c.toLowerCase().includes('month') || c.toLowerCase().includes('date'));
            if (!sortKey) {
                sortKey = columns[0]; // fallback to first column
            }

            const sorted = [...allData].sort((a, b) => {
                let valA = a[sortKey] !== undefined && a[sortKey] !== null ? a[sortKey].toString() : '';
                let valB = b[sortKey] !== undefined && b[sortKey] !== null ? b[sortKey].toString() : '';

                // Try to parse as date (ISO or DD-MM-YYYY or MM/DD/YYYY)
                const dateA = new Date(valA);
                const dateB = new Date(valB);
                if (!isNaN(dateA.getTime()) && !isNaN(dateB.getTime())) {
                    return order === 'asc' ? dateA - dateB : dateB - dateA;
                }

                // Otherwise, compare as string (alphabetical/numeric)
                return order === 'asc' ? valA.localeCompare(valB, undefined, {numeric: true}) : valB.localeCompare(valA, undefined, {numeric: true});
            });

            renderTable(sorted);
        }

        // Load data
        function loadData() {
            wrapper.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>`;
            fetch('/api/table/salary')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    allData = data;
                    sortData(currentOrder); // Render with default order
                })
                .catch(error => {
                    console.error('Error fetching salary data:', error);
                    wrapper.innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i> Failed to load salary records. Please try again later.
                        </div>
                    `;
                });
        }

        // Event listeners for sort buttons
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const order = this.dataset.order;
                // Toggle active visual state
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                sortData(order);
            });
        });

        // Set default active state (Ascending)
        document.querySelector('.sort-btn[data-order="asc"]').classList.add('active');

        // Initial load
        loadData();
    });
</script>
{% endblock %}
