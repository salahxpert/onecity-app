<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Salary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f4f7fc; --bg-card: #ffffff; --bg-header: linear-gradient(145deg, #0a2540, #1a3a5c);
            --text-primary: #0a2540; --text-secondary: #64748b; --border-color: #e9edf2;
            --shadow: 0 10px 30px rgba(10,37,64,0.12); --radius: 24px; --transition: 0.3s ease;
        }
        [data-bs-theme="dark"] { /* same */ }
        * { font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-primary); padding: 15px; transition: background var(--transition), color var(--transition); }
        .header-card { /* same */ }
        .data-card { background: var(--bg-card); border-radius: 20px; padding: 16px; border: 1px solid var(--border-color); overflow-x: auto; }
        .table-custom { font-size: 0.75rem; color: var(--text-primary); }
        .table-custom th { background: var(--bg-body); font-weight: 600; color: var(--text-primary); border-bottom: 2px solid var(--border-color); padding: 6px; cursor: pointer; }
        .table-custom td { padding: 6px; vertical-align: middle; }
        .search-box { max-width: 400px; margin-bottom: 14px; }
        .search-box input { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-color); border-radius: 60px; padding: 6px 16px; width: 100%; }
        .sort-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .sort-buttons .btn { border-radius: 60px; font-size: 0.75rem; padding: 4px 16px; }
        @media (max-width: 640px) { .header-card { flex-direction: column; align-items: stretch; text-align: center; } .search-box { max-width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header-card">
        <h2><i class="bi bi-cash me-2"></i>Salary</h2>
        <div class="nav-buttons">
            <a href="/"><i class="bi bi-arrow-left me-1"></i>Back</a>
            <a href="/accounts"><i class="bi bi-wallet2 me-1"></i>Accounts</a>
            <button class="btn btn-success btn-sm" onclick="location.reload()"><i class="bi bi-arrow-repeat me-1"></i>Refresh</button>
            <button class="theme-toggle" onclick="toggleTheme()"><i class="bi bi-moon-fill" id="themeIcon"></i> <span id="themeLabel">Dark</span></button>
        </div>
    </div>
    <div class="data-card">
        <div class="sort-buttons">
            <button class="btn btn-outline-primary active" onclick="sortSalary('asc')">Ascending</button>
            <button class="btn btn-outline-secondary" onclick="sortSalary('desc')">Descending</button>
        </div>
        <div class="search-box"><input type="text" id="searchInput" placeholder="Search by Employee, Month..." onkeyup="filterTable()"></div>
        <div class="table-responsive">
            <table class="table table-custom table-hover" id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="loading" class="text-center text-muted py-3"><i class="bi bi-hourglass-split me-2"></i>Loading...</div>
    </div>
</div>
<script>
function toggleTheme() { /* same */ }
function updateThemeUI(theme) { /* same */ }
(function() { /* same */ })();

let allData = [];
let currentSort = 'asc';

const tableName = 'salary';
async function loadData() {
    try {
        const res = await fetch(`/api/table/${tableName}`);
        const json = await res.json();
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        const loading = document.getElementById('loading');
        if (json.data && json.data.length > 0) {
            loading.style.display = 'none';
            allData = json.data;
            const cols = json.columns;
            let headerHtml = '<tr>';
            cols.forEach(col => { headerHtml += `<th>${col.replace(/_/g, ' ').toUpperCase()}</th>`; });
            headerHtml += '</tr>';
            thead.innerHTML = headerHtml;
            renderTable(allData);
        } else {
            loading.innerHTML = '<i class="bi bi-info-circle me-2"></i>No data found.';
        }
    } catch (err) {
        document.getElementById('loading').innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
    }
}

function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    const cols = document.querySelectorAll('#tableHead th');
    let bodyHtml = '';
    data.forEach(row => {
        bodyHtml += '<tr>';
        cols.forEach(th => {
            const key = th.innerText.toLowerCase().replace(/ /g, '_');
            let val = row[key];
            if (val === null || val === undefined) val = '-';
            bodyHtml += `<td>${val}</td>`;
        });
        bodyHtml += '</tr>';
    });
    tbody.innerHTML = bodyHtml;
}

function sortSalary(order) {
    currentSort = order;
    document.querySelectorAll('.sort-buttons .btn').forEach(btn => {
        btn.classList.remove('active');
    });
    if (order === 'asc') {
        document.querySelector('.sort-buttons .btn-outline-primary').classList.add('active');
        document.querySelector('.sort-buttons .btn-outline-secondary').classList.remove('active');
        allData.sort((a, b) => {
            const monthA = a.month || '';
            const monthB = b.month || '';
            return monthA.localeCompare(monthB);
        });
    } else {
        document.querySelector('.sort-buttons .btn-outline-secondary').classList.add('active');
        document.querySelector('.sort-buttons .btn-outline-primary').classList.remove('active');
        allData.sort((a, b) => {
            const monthA = a.month || '';
            const monthB = b.month || '';
            return monthB.localeCompare(monthA);
        });
    }
    renderTable(allData);
    filterTable();
}

function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const rows = document.querySelectorAll('#dataTable tbody tr');
    rows.forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
}

loadData();
</script>
</body>
</html>
