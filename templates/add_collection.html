<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Add Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f0f4f9; --bg-card: #ffffff; --bg-header: linear-gradient(145deg, #0a2540, #1a3a5c);
            --text-primary: #0a2540; --text-secondary: #64748b; --border-color: #e9edf2;
            --shadow: 0 10px 30px rgba(10,37,64,0.12); --radius: 24px; --transition: 0.3s ease;
        }
        [data-bs-theme="dark"] {
            --bg-body: #0f1724; --bg-card: #1a2634; --bg-header: linear-gradient(145deg, #0d1b2a, #1a2a3d);
            --text-primary: #e8edf4; --text-secondary: #94a3b8; --border-color: #2a3a4a; --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        * { font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-primary); padding: 15px; transition: background var(--transition), color var(--transition); }
        .header-card {
            background: var(--bg-header); border-radius: var(--radius); padding: 18px 24px; margin-bottom: 20px; box-shadow: var(--shadow);
            color: white; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
        }
        .header-card h2 { font-weight: 800; font-size: 1.2rem; margin: 0; }
        .header-card .nav-buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .header-card .nav-buttons a, .header-card .nav-buttons .theme-toggle {
            color: white; text-decoration: none; background: rgba(255,255,255,0.12);
            padding: 6px 14px; border-radius: 60px; font-size: 0.75rem;
            transition: var(--transition); display: inline-flex; align-items: center; gap: 4px;
            border: none; cursor: pointer;
        }
        .header-card .nav-buttons a:hover, .header-card .nav-buttons .theme-toggle:hover { background: rgba(255,255,255,0.25); }
        .form-card { background: var(--bg-card); border-radius: 20px; padding: 20px; border: 1px solid var(--border-color); }
        .form-control, .form-select { background: var(--bg-body); color: var(--text-primary); border-color: var(--border-color); border-radius: 12px; padding: 10px 14px; }
        .form-control:focus, .form-select:focus { border-color: #0a2540; box-shadow: 0 0 0 0.2rem rgba(10,37,64,0.1); }
        .btn-rounded { border-radius: 30px; padding: 10px 30px; font-weight: 600; }
        @media (max-width: 640px) { .header-card { flex-direction: column; align-items: stretch; text-align: center; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header-card">
        <h2><i class="bi bi-plus-circle me-2"></i>Add Collection</h2>
        <div class="nav-buttons">
            <a href="/"><i class="bi bi-house-door me-1"></i>Home</a>
            <a href="/accounts"><i class="bi bi-wallet2 me-1"></i>Accounts</a>
            <button class="theme-toggle" onclick="toggleTheme()"><i class="bi bi-moon-fill" id="themeIcon"></i> <span id="themeLabel">Dark</span></button>
        </div>
    </div>
    <div class="form-card">
        <form id="collectionForm">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label fw-semibold">MR No (optional)</label><input type="text" class="form-control" name="mr_no" placeholder="Auto-generate if empty"></div>
                <div class="col-md-6"><label class="form-label fw-semibold">Collection Date *</label><input type="date" class="form-control" name="collection_date" required></div>
                <div class="col-md-6"><label class="form-label fw-semibold">Sales Person *</label><select class="form-select" name="sales_person" required><option value="">Select...</option>{% for emp in employees %}<option value="{{ emp.name }}">{{ emp.name }}</option>{% endfor %}</select></div>
                <div class="col-md-6"><label class="form-label fw-semibold">Client Name *</label><input type="text" class="form-control" name="client_name" list="clientList" required><datalist id="clientList">{% for cl in clients %}<option value="{{ cl.name }}">{{ cl.name }} ({{ cl.project }})</option>{% endfor %}</datalist></div>
                <div class="col-md-4"><label class="form-label fw-semibold">Project *</label><input type="text" class="form-control" name="project" placeholder="e.g. BS, ACP" required></div>
                <div class="col-md-4"><label class="form-label fw-semibold">Unit/Plot</label><input type="number" class="form-control" name="unit" value="1"></div>
                <div class="col-md-4"><label class="form-label fw-semibold">MR Type *</label><select class="form-select" name="mr_type" required><option value="Booking">Booking (DP)</option><option value="Installment">Installment (EMI)</option><option value="Token">Token</option></select></div>
                <div class="col-md-4"><label class="form-label fw-semibold">Payment Type *</label><select class="form-select" name="payment_type" required><option value="Cash">Cash</option><option value="Online">Online (DD/FT)</option><option value="Clear Cheque">Clear Cheque</option><option value="Advance Cheque">Advance Cheque</option><option value="Dishonour Cheque">Dishonour Cheque</option></select></div>
                <div class="col-md-4"><label class="form-label fw-semibold">Amount (Taka) *</label><input type="number" class="form-control" name="amount" step="0.01" required></div>
                <div class="col-md-4"><label class="form-label fw-semibold">Cheque Status</label><input type="text" class="form-control" name="cheque_status" placeholder="e.g. 2026-08-10"></div>
                <div class="col-md-12"><label class="form-label fw-semibold">Source Sheet</label><select class="form-select" name="source_sheet"><option value="Manual Entry">Manual Entry</option>{% for sheet in sheets %}<option value="{{ sheet.source_sheet }}">{{ sheet.source_sheet }}</option>{% endfor %}</select></div>
            </div>
            <div class="mt-4 d-flex justify-content-between align-items-center flex-wrap">
                <button type="submit" class="btn btn-success btn-rounded"><i class="bi bi-save me-1"></i>Save & Auto-Post</button>
                <span id="msg" class="text-muted small"></span>
            </div>
        </form>
    </div>
</div>
<script>
function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-bs-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-bs-theme', next);
    localStorage.setItem('theme', next);
    updateThemeUI(next);
}
function updateThemeUI(theme) {
    const icon = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');
    if (icon && label) {
        if (theme === 'dark') { icon.className = 'bi bi-sun-fill'; label.textContent = 'Light'; }
        else { icon.className = 'bi bi-moon-fill'; label.textContent = 'Dark'; }
    }
}
(function() {
    const saved = localStorage.getItem('theme');
    if (saved) { document.documentElement.setAttribute('data-bs-theme', saved); updateThemeUI(saved); }
})();

document.getElementById('collectionForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = Object.fromEntries(formData);
    document.getElementById('msg').innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Processing...';
    try {
        const res = await fetch('/api/collection', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const result = await res.json();
        if (result.success) { document.getElementById('msg').innerHTML = `<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i>${result.message}</span>`; this.reset(); }
        else { document.getElementById('msg').innerHTML = `<span class="text-danger"><i class="bi bi-exclamation-triangle-fill me-1"></i>${result.error}</span>`; }
    } catch(err) { document.getElementById('msg').innerHTML = `<span class="text-danger"><i class="bi bi-x-circle-fill me-1"></i>${err.message}</span>`; }
});
</script>
</body>
</html>
