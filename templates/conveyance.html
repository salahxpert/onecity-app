{% extends "base.html" %}

{% block title %}Conveyance Records{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold"><i class="bi bi-truck"></i> Conveyance Records</h2>
            <p class="text-muted">Manage and filter conveyance records by status.</p>
        </div>
    </div>

    <!-- Filter Buttons -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="btn-group" role="group" aria-label="Conveyance filter">
                <button class="btn btn-outline-secondary active filter-btn" data-filter="all">All</button>
                <button class="btn btn-outline-danger filter-btn" data-filter="Pending">Pending</button>
                <button class="btn btn-outline-success filter-btn" data-filter="Regular">Regular</button>
            </div>
        </div>
    </div>

    <!-- Table Wrapper -->
    <div class="row">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div id="conveyanceTableWrapper" class="table-responsive">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const wrapper = document.getElementById('conveyanceTableWrapper');
        let allData = [];
        let currentFilter = 'all';

        // Helper: Render table
        function renderTable(data) {
            if (!data || data.length === 0) {
                wrapper.innerHTML = `
                    <div class="alert alert-info text-center" role="alert">
                        <i class="bi bi-info-circle"></i> No records found for this filter.
                    </div>
                `;
                return;
            }

            // Determine columns dynamically from first row
            const columns = Object.keys(data[0]);
            let html = `<table class="table table-striped table-hover align-middle">
                <thead class="table-light">
                    <tr>`;
            columns.forEach(col => {
                const displayName = col.charAt(0).toUpperCase() + col.slice(1).replace(/_/g, ' ');
                html += `<th>${displayName}</th>`;
            });
            html += `</tr></thead><tbody>`;

            data.forEach(row => {
                html += `<tr>`;
                columns.forEach(col => {
                    let value = row[col] !== undefined && row[col] !== null ? row[col] : '-';
                    // Special color coding for 'status' column
                    if (col.toLowerCase() === 'status') {
                        const statusLower = value.toString().toLowerCase();
                        if (statusLower === 'regular' || statusLower === 'paid') {
                            value = `<span class="badge bg-success fs-6">${value}</span>`;
                        } else if (statusLower === 'pending') {
                            value = `<span class="badge bg-danger fs-6">${value}</span>`;
                        } else {
                            value = `<span class="badge bg-secondary fs-6">${value}</span>`;
                        }
                    }
                    html += `<td>${value}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            wrapper.innerHTML = html;
        }

        // Filter logic
        function applyFilter(filter) {
            currentFilter = filter;
            if (filter === 'all') {
                renderTable(allData);
            } else {
                // Filter data based on 'status' column (case insensitive)
                const statusCol = Object.keys(allData[0] || {}).find(c => c.toLowerCase() === 'status');
                if (statusCol) {
                    const filtered = allData.filter(row => {
                        const status = (row[statusCol] || '').toString().toLowerCase();
                        return status === filter.toLowerCase();
                    });
                    renderTable(filtered);
                } else {
                    // If no status column, just show all
                    renderTable(allData);
                }
            }
        }

        // Load data
        function loadData() {
            wrapper.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>`;
            fetch('/api/table/conveyance')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    allData = data;
                    applyFilter(currentFilter); // Render with current filter
                })
                .catch(error => {
                    console.error('Error fetching conveyance data:', error);
                    wrapper.innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i> Failed to load conveyance records. Please try again later.
                        </div>
                    `;
                });
        }

        // Event listeners for filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // Update active state
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                // Apply filter
                const filter = this.dataset.filter;
                applyFilter(filter);
            });
        });

        // Initial load
        loadData();
    });
</script>
{% endblock %}
