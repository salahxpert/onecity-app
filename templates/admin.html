{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold"><i class="bi bi-speedometer2"></i> Admin Dashboard</h2>
            <p class="text-muted">Overview of all database tables and records.</p>
        </div>
    </div>

    <!-- Search Filter for Tables -->
    <div class="row mb-4">
        <div class="col-md-6 col-lg-4">
            <input type="text" id="tableSearch" class="form-control form-control-lg" placeholder="Filter tables by name...">
        </div>
    </div>

    <!-- Grid Container for Table Cards (LTR) -->
    <div id="tableGrid" class="row g-4">
        <!-- Cards will be dynamically loaded here -->
        <div class="col-12 text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const grid = document.getElementById('tableGrid');
        const searchInput = document.getElementById('tableSearch');
        let allTables = [];

        // Fetch database statistics from the backend
        fetch('/api/db_stats')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                // Transform data into an array of objects for easier filtering
                allTables = Object.keys(data).map(key => ({
                    name: key,
                    count: data[key]
                }));
                renderCards(allTables);
            })
            .catch(error => {
                console.error('Error fetching table stats:', error);
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i> Failed to load table statistics. Please check your connection or try again.
                        </div>
                    </div>
                `;
            });

        // Render cards based on filtered data
        function renderCards(tables) {
            if (tables.length === 0) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-info" role="alert">
                            <i class="bi bi-info-circle-fill"></i> No tables match your search criteria.
                        </div>
                    </div>
                `;
                return;
            }

            let html = '';
            tables.forEach(table => {
                // Capitalize table name for display
                const displayName = table.name.charAt(0).toUpperCase() + table.name.slice(1).replace(/_/g, ' ');
                html += `
                    <div class="col-12 col-sm-6 col-md-4 col-lg-3 table-card-item">
                        <div class="card h-100 shadow-sm border-0 hover-shadow transition">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title text-primary fw-bold">
                                    <i class="bi bi-table"></i> ${displayName}
                                </h5>
                                <p class="card-text display-6 fw-semibold my-3">${table.count}</p>
                                <p class="card-text text-muted small">Total Records</p>
                                <a href="/admin/table/${table.name}" class="btn btn-outline-primary mt-auto">
                                    <i class="bi bi-eye"></i> View Records
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // Filter logic for search input
        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            if (query === '') {
                renderCards(allTables);
            } else {
                const filtered = allTables.filter(t => t.name.toLowerCase().includes(query));
                renderCards(filtered);
            }
        });

        // Add custom hover styles
        const style = document.createElement('style');
        style.textContent = `
            .hover-shadow {
                transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            }
            .hover-shadow:hover {
                transform: translateY(-5px);
                box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
            }
            .transition {
                transition: all 0.2s ease-in-out;
            }
        `;
        document.head.appendChild(style);
    });
</script>
{% endblock %}
