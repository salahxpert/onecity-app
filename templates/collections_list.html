{% extends "base.html" %}

{% block title %}All Collections{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold"><i class="bi bi-list-ul"></i> All Collections</h2>
            <p class="text-muted">View, search, and analyze all collection records.</p>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4" id="summaryCards">
        <div class="col-6 col-md-2">
            <div class="card border-0 shadow-sm text-center p-2">
                <small class="text-muted">Total</small>
                <h4 class="fw-bold" id="totalCount">0</h4>
            </div>
        </div>
        <div class="col-6 col-md-2">
            <div class="card border-0 shadow-sm text-center p-2">
                <small class="text-muted">Cash</small>
                <h4 class="fw-bold text-success" id="cashCount">0</h4>
            </div>
        </div>
        <div class="col-6 col-md-2">
            <div class="card border-0 shadow-sm text-center p-2">
                <small class="text-muted">Online</small>
                <h4 class="fw-bold text-primary" id="onlineCount">0</h4>
            </div>
        </div>
        <div class="col-6 col-md-2">
            <div class="card border-0 shadow-sm text-center p-2">
                <small class="text-muted">Clear Cheque</small>
                <h4 class="fw-bold text-info" id="clearChequeCount">0</h4>
            </div>
        </div>
        <div class="col-6 col-md-2">
            <div class="card border-0 shadow-sm text-center p-2">
                <small class="text-muted">Advance Cheque</small>
                <h4 class="fw-bold text-warning" id="advanceChequeCount">0</h4>
            </div>
        </div>
        <div class="col-6 col-md-2">
            <div class="card border-0 shadow-sm text-center p-2">
                <small class="text-muted">Dishonour Cheque</small>
                <h4 class="fw-bold text-danger" id="dishonourChequeCount">0</h4>
            </div>
        </div>
    </div>

    <!-- Search and Table -->
    <div class="row">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <input type="text" id="collectionSearch" class="form-control form-control-lg" placeholder="Search by client, amount, or reference...">
                        </div>
                    </div>
                    <div id="collectionTableWrapper" class="table-responsive">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const wrapper = document.getElementById('collectionTableWrapper');
        const searchInput = document.getElementById('collectionSearch');
        let allData = [];
        let columns = [];

        // Helper: Render table and update summary
        function renderData(data) {
            if (!data || data.length === 0) {
                wrapper.innerHTML = `
                    <div class="alert alert-info text-center" role="alert">
                        <i class="bi bi-info-circle"></i> No collection records found.
                    </div>
                `;
                updateSummary([]);
                return;
            }

            // Update summary cards based on the full dataset (or filtered? usually full)
            // We will update summary based on the filtered data to keep it interactive,
            // but the guideline likely wants totals of ALL data. Let's update based on the filtered view.
            // Actually, better to show total based on filtered results so user sees impact of search.
            updateSummary(data);

            // Render table
            columns = Object.keys(data[0]);
            let html = `<table class="table table-striped table-hover align-middle">
                <thead class="table-light">
                    <tr>`;
            columns.forEach(col => {
                const displayName = col.charAt(0).toUpperCase() + col.slice(1).replace(/_/g, ' ');
                html += `<th>${displayName}</th>`;
            });
            html += `</tr></thead><tbody>`;

            data.forEach(row => {
                html += `<tr>`;
                columns.forEach(col => {
                    let value = row[col] !== undefined && row[col] !== null ? row[col] : '-';
                    html += `<td>${value}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            wrapper.innerHTML = html;
        }

        // Update summary cards from filtered data
        function updateSummary(data) {
            const total = data.length;
            document.getElementById('totalCount').innerText = total;

            // Define possible type/mode columns to check
            const typeKeys = ['mode', 'type', 'payment_mode', 'cheque_type'];
            let typeCol = null;
            for (const key of typeKeys) {
                if (data.length > 0 && data[0].hasOwnProperty(key)) {
                    typeCol = key;
                    break;
                }
            }

            // If no type column found, just show total and hide others or show 0
            if (!typeCol) {
                document.getElementById('cashCount').innerText = 'N/A';
                document.getElementById('onlineCount').innerText = 'N/A';
                document.getElementById('clearChequeCount').innerText = 'N/A';
                document.getElementById('advanceChequeCount').innerText = 'N/A';
                document.getElementById('dishonourChequeCount').innerText = 'N/A';
                return;
            }

            // Count occurrences (or sum amounts if amount column exists)
            const amountCol = data.length > 0 && data[0].hasOwnProperty('amount') ? 'amount' : (data[0].hasOwnProperty('total') ? 'total' : null);

            const counts = {
                'Cash': 0,
                'Online': 0,
                'Clear Cheque': 0,
                'Advance Cheque': 0,
                'Dishonour Cheque': 0
            };

            // Normalize and count
            data.forEach(row => {
                let typeVal = (row[typeCol] || '').toString().trim().toLowerCase();
                if (typeVal.includes('cash')) counts['Cash'] += 1;
                else if (typeVal.includes('online')) counts['Online'] += 1;
                else if (typeVal.includes('clear')) counts['Clear Cheque'] += 1;
                else if (typeVal.includes('advance')) counts['Advance Cheque'] += 1;
                else if (typeVal.includes('dishonour') || typeVal.includes('dishonor')) counts['Dishonour Cheque'] += 1;
                else {
                    // Fallback: try to match exact words
                    const words = typeVal.split(/[\s,_-]+/);
                    if (words.includes('cash')) counts['Cash'] += 1;
                    else if (words.includes('online')) counts['Online'] += 1;
                    else if (words.includes('clear') && words.includes('cheque')) counts['Clear Cheque'] += 1;
                    else if (words.includes('advance') && words.includes('cheque')) counts['Advance Cheque'] += 1;
                    else if ((words.includes('dishonour') || words.includes('dishonor')) && words.includes('cheque')) counts['Dishonour Cheque'] += 1;
                }
            });

            document.getElementById('cashCount').innerText = counts['Cash'];
            document.getElementById('onlineCount').innerText = counts['Online'];
            document.getElementById('clearChequeCount').innerText = counts['Clear Cheque'];
            document.getElementById('advanceChequeCount').innerText = counts['Advance Cheque'];
            document.getElementById('dishonourChequeCount').innerText = counts['Dishonour Cheque'];
        }

        // Filter data based on search input
        function filterData(query) {
            if (!query.trim()) {
                renderData(allData);
                return;
            }
            const q = query.trim().toLowerCase();
            const filtered = allData.filter(row => {
                return Object.values(row).some(val => {
                    return (val !== null && val !== undefined && val.toString().toLowerCase().includes(q));
                });
            });
            renderData(filtered);
        }

        // Load data
        function loadData() {
            wrapper.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>`;
            fetch('/api/table/collections')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    allData = data;
                    renderData(allData);
                })
                .catch(error => {
                    console.error('Error fetching collections:', error);
                    wrapper.innerHTML = `
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i> Failed to load collection records. Please try again later.
                        </div>
                    `;
                });
        }

        // Event listeners
        searchInput.addEventListener('input', function(e) {
            filterData(e.target.value);
        });

        // Initial load
        loadData();
    });
</script>
{% endblock %}
